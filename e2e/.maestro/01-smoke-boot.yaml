# e2e/.maestro/01-smoke-boot.yaml
# Smoke test: the E2E devRelease APK boots and renders the Chat screen.
#
# This is the MINIMUM viable E2E assertion: the JS bundle (baked by the
# devRelease build) loads, the SQLite migrations run, and the main Chat
# tab renders its title. That proves the whole boot path end-to-end.
#
# The retired remote-WSS auto-pairing model (HARMONY_LINK_WSS_URL/WS_URL →
# socat → harmony-link container) was removed in 7-9. The current pairing path
# is the sync-client LAN transport, driven against the container engine by the
# E2E-only build-time override (plan 7-13; see e2e/README.md → "E2E-only
# engine-URL override"). This flow stays BOOT-ONLY: it asserts the on-device
# boot path and does not wait on pairing. Add a separate pairing flow to
# exercise the device-approval handshake.

appId: ai.soulbits.chat.dev

---
- launchApp:
    clearState: true         # start fresh — no leftover DB from previous runs

# Wait for the Chat tab screen to render its title.
# First launch runs the SQLite migrations — this can take 15-30s on emulator.
- extendedWaitUntil:
    label: "Chat screen title renders"
    visible:
      text: "Chats"
    timeout: 60000

# A short settle so the app is interactive before the screenshot.
- extendedWaitUntil:
    label: "App is interactive (settled post-boot)"
    visible:
      text: "Chats"
    timeout: 10000

# Take a screenshot for test reports.
- takeScreenshot: smoke-boot-complete
