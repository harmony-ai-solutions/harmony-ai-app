name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number for the build'
        default: 'v0.0.0-dev'
      engine_version:
        description: 'Soulbits Engine version to provision (e.g. v0.3.2). Falls back to the ENGINE_SIDECAR_VERSION repo variable.'
        default: ''
      skip_build:
        description: 'Run tests only, skip APK/IPA builds (dry-run)'
        type: boolean
        default: false
      build_ios:
        description: 'Also build the iOS IPA matrix (macOS runners bill at 10× the Linux minute rate). Release tags always build iOS.'
        type: boolean
        default: false
      publish_latest:
        description: 'Also publish the channel manifest (app/dev/latest.json) so installed dev builds see this release. Tag runs always publish both channel manifests.'
        type: boolean
        default: false

jobs:
  # ───────────────────────────────────────────────────────────────────
  # Test gate — must pass before any artifact is built
  # ───────────────────────────────────────────────────────────────────
  test:
    name: Tests (pre-release gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npx jest --selectProjects unit --reporters=default --reporters=jest-junit
        env:
          JEST_JUNIT_OUTPUT_DIR: ./reports
          JEST_JUNIT_OUTPUT_NAME: unit-tests.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-release-test-results
          path: reports/

  # ───────────────────────────────────────────────────────────────────
  # NOTE: Pre-release E2E gate is intentionally NOT wired here yet.
  # To add it: insert an `e2e-android-prerelease` job between `test`
  # and `build-android`, with `needs: test` and add it to
  # `build-android`'s needs: [test, e2e-android-prerelease].
  # Recommended: wait until nightly E2E runs are stable for ~2 weeks,
  # then add the gate. See Phase 7-3 step 5 in the plan docs.
  # ───────────────────────────────────────────────────────────────────

  # ──────────────────────────────────────────────
  # Job 1: Build Android APK (matrix: dev, prod)
  # ──────────────────────────────────────────────
  build-android:
    name: Build Android APK (${{ matrix.environment }})
    needs: test
    if: ${{ !inputs.skip_build }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Set VERSION variable
        run: |
          INPUTS_VERSION='${{ github.event.inputs.version }}'
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          elif [[ "${GITHUB_EVENT_NAME}" == 'workflow_dispatch' && -n "${INPUTS_VERSION}" ]]; then
            VERSION="${INPUTS_VERSION}"
          else
            VERSION="v0.0.0-dev"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Decode release keystore
        run: |
          echo "${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Resolve engine version
        run: |
          ENGINE_VERSION='${{ github.event.inputs.engine_version }}'
          if [ -z "${ENGINE_VERSION}" ]; then
            ENGINE_VERSION='${{ vars.ENGINE_SIDECAR_VERSION }}'
          fi
          if [ -z "${ENGINE_VERSION}" ]; then
            echo "::error::No engine version: set the 'engine_version' workflow input or the ENGINE_SIDECAR_VERSION repo variable."
            exit 1
          fi
          echo "ENGINE_VERSION=${ENGINE_VERSION}" >> $GITHUB_ENV
          echo "::notice::Provisioning Soulbits Engine ${ENGINE_VERSION}"

      - name: Build ${{ matrix.environment }} release APK
        working-directory: android
        run: |
          if [ -z "$GOOGLE_WEB_CLIENT_ID" ]; then echo "::error::GOOGLE_WEB_CLIENT_ID_DEV/_PROD variable not set"; exit 1; fi
          # Update versionName in build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${VERSION}\"/" app/build.gradle
          chmod +x gradlew
          ./gradlew assemble${{ matrix.environment == 'dev' && 'Dev' || 'Prod' }}Release \
            -PRELEASE_KEYSTORE_FILE=release.keystore \
            -PRELEASE_KEYSTORE_PASSWORD="${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}" \
            -PRELEASE_KEY_ALIAS="${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}" \
            -PRELEASE_KEY_PASSWORD="${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}" \
            -PGOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID" \
            -PAPPLE_SERVICES_ID="${{ vars.APPLE_SERVICES_ID }}" \
            -PENGINE_SIDECAR_VERSION="${ENGINE_VERSION}" \
            -PENGINE_SIDECAR_BASE_URL="https://download.soulbits.app/engine" \
            -PENGINE_SIDECAR_STRICT=true
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ matrix.environment == 'dev' && vars.GOOGLE_WEB_CLIENT_ID_DEV || vars.GOOGLE_WEB_CLIENT_ID_PROD }}

      - name: Assert APK contains the engine sidecar
        working-directory: android
        run: |
          APK_PATH="app/build/outputs/apk/${{ matrix.environment }}/release/app-${{ matrix.environment }}-release.apk"
          echo "── libengine.so entries in ${APK_PATH} ──"
          unzip -l "${APK_PATH}" | grep -E 'libengine\.so' || {
            echo "::error::APK is missing libengine.so — engine provisioning failed (plan 7-10 §2)."
            exit 1
          }

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_S3_UPLOAD_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_S3_UPLOAD_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Upload APK to S3 (versioned)
        run: |
          APK_PATH="android/app/build/outputs/apk/${{ matrix.environment }}/release/app-${{ matrix.environment }}-release.apk"
          S3_VERSIONED="s3://soulbits-releases/app/${VERSION}/${{ matrix.environment }}/harmony-ai-app-${VERSION}-android.apk"
          echo "Uploading ${APK_PATH} to ${S3_VERSIONED}"
          aws s3 cp "${APK_PATH}" "${S3_VERSIONED}"

      - name: Update latest APK pointer
        run: |
          APK_PATH="android/app/build/outputs/apk/${{ matrix.environment }}/release/app-${{ matrix.environment }}-release.apk"
          S3_LATEST="s3://soulbits-releases/app/latest/${{ matrix.environment }}/harmony-ai-app-android.apk"
          echo "Updating latest pointer: ${S3_LATEST}"
          aws s3 cp "${APK_PATH}" "${S3_LATEST}"

      - name: Print download URLs
        run: |
          echo "✅ APK uploaded successfully!"
          echo "📥 Versioned: https://download.soulbits.app/app/${VERSION}/${{ matrix.environment }}/harmony-ai-app-${VERSION}-android.apk"
          echo "📥 Latest:    https://download.soulbits.app/app/latest/${{ matrix.environment }}/harmony-ai-app-android.apk"

  # ──────────────────────────────────────────────
  # Job 2: Build iOS IPA (matrix: dev, prod, unsigned for sideloading)
  # ──────────────────────────────────────────────
  build-ios:
    name: Build iOS IPA (${{ matrix.environment }})
    needs: test
    # macOS runners bill at 10× the Linux minute rate — run only when
    # explicitly required (owner ruling 2026-10-13): on release tags
    # (refs/tags/v*, where create-release's GitHub Release body links the IPAs;
    # skipping would publish dead links) or when a manual dispatch opts in
    # via the `build_ios` input. Plain dispatch runs are Android-only.
    if: ${{ !inputs.skip_build && (inputs.build_ios == true || github.event_name == 'push') }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolve engine version
        run: |
          ENGINE_VERSION='${{ github.event.inputs.engine_version }}'
          if [ -z "${ENGINE_VERSION}" ]; then
            ENGINE_VERSION='${{ vars.ENGINE_SIDECAR_VERSION }}'
          fi
          if [ -z "${ENGINE_VERSION}" ]; then
            echo "::error::No engine version: set the 'engine_version' workflow input or the ENGINE_SIDECAR_VERSION repo variable."
            exit 1
          fi
          echo "ENGINE_VERSION=${ENGINE_VERSION}" >> $GITHUB_ENV
          echo "::notice::Provisioning Soulbits Engine ${ENGINE_VERSION}"

      - name: Fetch Soulbits Engine xcframework
        run: |
          set -euo pipefail
          mkdir -p ios/Frameworks
          URL="https://download.soulbits.app/engine/${ENGINE_VERSION}/SoulbitsEngine.xcframework.zip"
          echo "Downloading ${URL}"
          curl -fSL "${URL}" -o /tmp/SoulbitsEngine.xcframework.zip
          unzip -q -o /tmp/SoulbitsEngine.xcframework.zip -d ios/Frameworks
          echo "── ios/Frameworks ──"
          ls -la ios/Frameworks

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Set VERSION variable
        run: |
          INPUTS_VERSION='${{ github.event.inputs.version }}'
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          elif [[ "${GITHUB_EVENT_NAME}" == 'workflow_dispatch' && -n "${INPUTS_VERSION}" ]]; then
            VERSION="${INPUTS_VERSION}"
          else
            VERSION="v0.0.0-dev"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Generate .env for ${{ matrix.environment }}
        run: |
          if [ -z "$GOOGLE_WEB_CLIENT_ID" ]; then echo "::error::GOOGLE_WEB_CLIENT_ID_DEV/_PROD variable not set"; exit 1; fi
          # APP_VARIANT (plan 7-14): 'full' for every current matrix entry. A
          # future store iOS matrix entry would set this to 'store' (same bundle
          # id — no suffix; the store listing owns updates).
          printf 'APP_ENV=%s\nAPP_VARIANT=full\nIS_BETA=%s\nGOOGLE_WEB_CLIENT_ID=%s\nAPPLE_SERVICES_ID=%s\n' \
            "${{ matrix.environment }}" \
            "${{ matrix.environment == 'dev' && 'true' || 'false' }}" \
            "$GOOGLE_WEB_CLIENT_ID" \
            "${{ vars.APPLE_SERVICES_ID }}" > .env
          echo "::notice::Generated .env for ${{ matrix.environment }} (APP_ENV=${{ matrix.environment }}, IS_BETA=${{ matrix.environment == 'dev' && 'true' || 'false' }})"
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ matrix.environment == 'dev' && vars.GOOGLE_WEB_CLIENT_ID_DEV || vars.GOOGLE_WEB_CLIENT_ID_PROD }}

      - name: Build ${{ matrix.environment }} iOS app
        working-directory: ios
        run: |
          xcodebuild \
            -workspace HarmonyAIChat.xcworkspace \
            -scheme HarmonyAIChat \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath build \
            clean archive \
            -archivePath build/HarmonyAIChat.xcarchive \
            PRODUCT_BUNDLE_IDENTIFIER=ai.soulbits.chat${{ matrix.environment == 'dev' && '.dev' || '' }}

      - name: Package ${{ matrix.environment }} IPA
        run: |
          chmod +x scripts/package-ios-ipa.sh
          IPA_OUTPUT="${PWD}/harmony-ai-app-${VERSION}-ios.ipa"
          ./scripts/package-ios-ipa.sh \
            ios/build/HarmonyAIChat.xcarchive/Products/Applications/HarmonyAIChat.app \
            "${IPA_OUTPUT}"
          ls -la "${IPA_OUTPUT}"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_S3_UPLOAD_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_S3_UPLOAD_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Upload IPA to S3 (versioned)
        run: |
          S3_VERSIONED="s3://soulbits-releases/app/${VERSION}/${{ matrix.environment }}/harmony-ai-app-${VERSION}-ios.ipa"
          echo "Uploading IPA to ${S3_VERSIONED}"
          aws s3 cp "harmony-ai-app-${VERSION}-ios.ipa" "${S3_VERSIONED}"

      - name: Update latest IPA pointer
        run: |
          S3_LATEST="s3://soulbits-releases/app/latest/${{ matrix.environment }}/harmony-ai-app-ios.ipa"
          echo "Updating latest pointer: ${S3_LATEST}"
          aws s3 cp "harmony-ai-app-${VERSION}-ios.ipa" "${S3_LATEST}"

      - name: Print download URLs
        run: |
          echo "✅ IPA uploaded successfully!"
          echo "📥 Versioned: https://download.soulbits.app/app/${VERSION}/${{ matrix.environment }}/harmony-ai-app-${VERSION}-ios.ipa"
          echo "📥 Latest:    https://download.soulbits.app/app/latest/${{ matrix.environment }}/harmony-ai-app-ios.ipa"

  # ──────────────────────────────────────────────
  # Job 3: Publish the channel release manifests (app/<env>/latest.json)
  # ──────────────────────────────────────────────
  # Per-channel manifests (owner ruling 2026-10-17): each channel reads ONLY
  # its own file, so dev dispatches are invisible to prod installs.
  #   - dispatch with publish_latest=true → writes app/dev/latest.json ONLY
  #   - tag v*                              → writes BOTH dev and prod files
  # SINGLE WRITER: only this job writes these files. It needs build-android
  # only (URLs are deterministic, not artifact-derived), so a dispatch that
  # skips the iOS matrix can still publish. The manifest shape is a de-facto
  # public contract — owner sign-off is an explicit gate; do not change field
  # names/URLs without it. The dev file's version carries the flavor's exact
  # "-dev" suffix (android versionNameSuffix) so an up-to-date dev install
  # compares EQUAL and the update banner stays silent.
  publish-manifest:
    name: Publish channel manifests
    needs: [build-android]
    if: ${{ inputs.publish_latest == true || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set VERSION variable
        run: |
          INPUTS_VERSION='${{ github.event.inputs.version }}'
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          elif [[ "${GITHUB_EVENT_NAME}" == 'workflow_dispatch' && -n "${INPUTS_VERSION}" ]]; then
            VERSION="${INPUTS_VERSION}"
          else
            VERSION="v0.0.0-dev"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_S3_UPLOAD_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_S3_UPLOAD_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Write channel manifests (app/<env>/latest.json)
        env:
          RELEASES_BASE_URL: https://download.soulbits.app
        run: |
          set -euo pipefail
          RELEASED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          NOTES_URL="https://github.com/harmony-ai-solutions/harmony-ai-app/releases/tag/${VERSION}"
          # NOTE: heredoc terminators must stay at column 0 of the shell
          # script — do not indent the JSON lines further in YAML.
          cat > app-dev-latest.json <<JSON
          {
            "version": "${VERSION}-dev",
            "releasedAt": "${RELEASED_AT}",
            "notesUrl": "${NOTES_URL}",
            "android": { "url": "${RELEASES_BASE_URL}/app/${VERSION}/dev/harmony-ai-app-${VERSION}-android.apk" },
            "ios":     { "url": "${RELEASES_BASE_URL}/app/${VERSION}/dev/harmony-ai-app-${VERSION}-ios.ipa" }
          }
          JSON
          cat > app-prod-latest.json <<JSON
          {
            "version": "${VERSION}",
            "releasedAt": "${RELEASED_AT}",
            "notesUrl": "${NOTES_URL}",
            "android": { "url": "${RELEASES_BASE_URL}/app/${VERSION}/prod/harmony-ai-app-${VERSION}-android.apk" },
            "ios":     { "url": "${RELEASES_BASE_URL}/app/${VERSION}/prod/harmony-ai-app-${VERSION}-ios.ipa" }
          }
          JSON
          cat app-dev-latest.json
          aws s3 cp app-dev-latest.json "s3://soulbits-releases/app/dev/latest.json"
          echo "✅ dev manifest: https://download.soulbits.app/app/dev/latest.json"
          # Prod manifest: tag releases ONLY — a dev dispatch must never
          # advertise versions to prod-channel installs.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            cat app-prod-latest.json
            aws s3 cp app-prod-latest.json "s3://soulbits-releases/app/prod/latest.json"
            echo "✅ prod manifest: https://download.soulbits.app/app/prod/latest.json"
          else
            echo "Dispatch run: app/prod/latest.json intentionally NOT published"
          fi

  # ──────────────────────────────────────────────
  # Job 4: Create GitHub Release with download links
  # ──────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Harmony AI App ${{ github.ref_name }}
          body: |
            ## Downloads

            | Environment | Platform | Download |
            |-------------|----------|----------|
            | dev | Android | [APK](https://download.soulbits.app/app/${{ github.ref_name }}/dev/harmony-ai-app-${{ github.ref_name }}-android.apk) |
            | dev | iOS | [IPA](https://download.soulbits.app/app/${{ github.ref_name }}/dev/harmony-ai-app-${{ github.ref_name }}-ios.ipa) |
            | prod | Android | [APK](https://download.soulbits.app/app/${{ github.ref_name }}/prod/harmony-ai-app-${{ github.ref_name }}-android.apk) |
            | prod | iOS | [IPA](https://download.soulbits.app/app/${{ github.ref_name }}/prod/harmony-ai-app-${{ github.ref_name }}-ios.ipa) |

            **Latest builds** (always up-to-date):
            - **dev**: [Android APK](https://download.soulbits.app/app/latest/dev/harmony-ai-app-android.apk) · [iOS IPA](https://download.soulbits.app/app/latest/dev/harmony-ai-app-ios.ipa)
            - **prod**: [Android APK](https://download.soulbits.app/app/latest/prod/harmony-ai-app-android.apk) · [iOS IPA](https://download.soulbits.app/app/latest/prod/harmony-ai-app-ios.ipa)

            See [INSTALLATION.md](https://github.com/harmony-ai-solutions/harmony-ai-app/blob/main/docs/INSTALLATION.md) for installation instructions.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The channel release manifests (app/<env>/latest.json) are written by the
      # `publish-manifest` job (Job 3) — this job no longer writes a manifest.
