# .github/workflows/e2e-android.yml
# Android E2E — runs in Docker with KVM acceleration on ubuntu-latest
#
# Builds the Soulbits Engine image LOCALLY from harmony-link-private, then runs
# the Maestro flows via docker compose. The compose file uses the local image
# soulbits/harmony-link:latest with pull_policy: never (it is not published to a
# Docker registry), so there is no image pull — CI must build it (below).
#
# The same Maestro YAML flows from e2e/.maestro/ are reused for iOS.
#
# Cost: Included in GitHub Actions Linux minutes (free tier has ~2000 min/mo).
# Nightly run + ~5 manual dispatches ≈ ~200 min/mo.
#
# See e2e/README.md and e2e/docker-compose.yml.

name: E2E (Android, Docker)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'e2e/**'
      - '.github/workflows/e2e-android.yml'
    # Only run on PRs that touch E2E infrastructure; otherwise rely on nightly

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Build the E2E debug APK
  # ─────────────────────────────────────────────────────────────────
  build-apk:
    name: Build debug APK (E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: npm ci
      - name: Build E2E APK (devRelease — JS-bundled, debug-signed)
        # devDebug is in `debuggableVariants`, so the RN gradle plugin does NOT
        # bundle JS — it expects Metro, which the Docker stack does not run
        # (blank screen). The E2E stack needs a JS-bundled APK, so build
        # devRelease with the debug-signing override (no release keystore /
        # ProGuard). Mirrors e2e/build-apk.sh.
        env:
          ENVFILE: .env.e2e
        working-directory: android
        run: |
          chmod +x gradlew
          # -PE2E_ENGINE_PEER_* injects the container engine's LAN endpoints so
          # the app's embedded engine sync client pairs with soulbits-engine and
          # the device-approval handshake runs (plan 7-13). The Android-only
          # compose uses socat to bridge the emulator's 10.0.2.2 to the engine.
          ./gradlew assembleDevRelease \
            -PE2E_DEBUG_SIGNING=true \
            -PE2E_ENGINE_PEER_WS_URL=10.0.2.2:28080 \
            -PE2E_ENGINE_PEER_WSS_URL=10.0.2.2:28443
      - name: Copy APK to E2E dir
        run: |
          cp android/app/build/outputs/apk/dev/release/app-dev-release.apk e2e/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-apk
          path: e2e/app-debug.apk

  # ─────────────────────────────────────────────────────────────────
  # Run the E2E suite (Docker Compose + Maestro)
  #
  # The compose file uses the LOCAL image soulbits/harmony-link:latest
  # (pull_policy: never), so this job checks out harmony-link-private and
  # builds the image before starting the stack. There is no Docker Hub image.
  # ─────────────────────────────────────────────────────────────────
  run-e2e:
    name: Run E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-apk]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: e2e-apk
          path: e2e/

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0777"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm

      - name: Checkout engine repo (build context for the E2E engine image)
        uses: actions/checkout@v4
        with:
          repository: harmony-ai-solutions/harmony-link-private
          token: ${{ secrets.HARMONY_LINK_REPO_PAT }}
          path: engine
          ref: main

      - name: Build Soulbits Engine image (local, not on Docker Hub)
        run: docker build -t soulbits/harmony-link:latest engine

      - name: Start Compose stack
        working-directory: e2e
        run: |
          docker compose up -d soulbits-engine android-emulator

      - name: Wait for emulator boot
        run: |
          for i in $(seq 1 60); do
            STATUS=$(docker exec android-emulator cat /home/androidusr/device_status 2>/dev/null || echo "not ready")
            echo "Attempt $i: $STATUS"
            if echo "$STATUS" | grep -q "device_status=online\|booted"; then
              echo "Emulator ready!"
              break
            fi
            sleep 10
          done

      - name: Run Maestro
        working-directory: e2e
        run: docker compose up maestro-runner --abort-on-container-exit --exit-code-from maestro-runner

      - name: Collect reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-android-reports
          path: e2e/reports/

      - name: Dump emulator logs on failure
        if: failure()
        run: |
          docker compose -f e2e/docker-compose.yml logs android-emulator > emulator.log 2>&1 || true
          docker compose -f e2e/docker-compose.yml logs soulbits-engine > soulbits-engine.log 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-android-logs
          path: |
            emulator.log
            soulbits-engine.log

      - name: Tear down
        if: always()
        working-directory: e2e
        run: docker compose down -v
