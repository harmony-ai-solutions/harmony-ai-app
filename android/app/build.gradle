apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    debuggableVariants = ["devDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

// ── OAuth secrets resolution ──────────────────────────────────────────
// Priority (first non-empty wins):
//   1. -PGOOGLE_WEB_CLIENT_ID / -PAPPLE_SERVICES_ID (CI/CLI override, e.g.
//      .github/workflows/build-release.yml passes vars.GOOGLE_WEB_CLIENT_ID).
//   2. android/gradle-secrets.<flavor>.properties generated by
//      scripts/oauth-secrets.cjs (`npm run oauth:dev|prod`) — gitignored,
//      per-environment, sourced from the GCP client_secret_*.json files.
//   3. '' (empty — Google Sign-In falls back to SDK auto-discovery).
//
// Nothing here is hardcoded in a tracked file.
def loadOAuthSecretsFile = { flavorName ->
    def secretsFile = file("../gradle-secrets.${flavorName}.properties")
    def props = new Properties()
    if (secretsFile.exists()) {
        secretsFile.withInputStream { props.load(it) }
    }
    return props
}

def oauthSecretsDev = loadOAuthSecretsFile('dev')
def oauthSecretsProd = loadOAuthSecretsFile('prod')

def resolveOAuthValue = { flavorName, key ->
    def cliValue = project.findProperty(key)
    if (cliValue) return cliValue
    def props = (flavorName == 'dev') ? oauthSecretsDev : oauthSecretsProd
    return props.getProperty(key, '')
}

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// ── google-services.json placeholder guard ─────────────────────────────
// Android Google Sign-In auto-discovers its OAuth client from
// android/app/google-services.json (NOT from GOOGLE_WEB_CLIENT_ID). If that
// file still contains the placeholder values, the SDK returns
// idToken=null after the user picks an account.
def googleServicesFile = file("google-services.json")
def isPlaceholder = false
if (googleServicesFile.exists()) {
    def gsText = googleServicesFile.text
    isPlaceholder = gsText.contains("000000000000") || gsText.contains("soulbits-placeholder")
}
if (isPlaceholder) {
    println "****************************************************************"
    println "*** WARNING: android/app/google-services.json is a PLACEHOLDER ***"
    println "*** Google Sign-In on Android will return idToken=null.       ***"
    println "*** Replace it with the real file from GCP (Firebase console), ***"
    println "*** containing BOTH package names ai.soulbits.chat and        ***"
    println "*** ai.soulbits.chat.dev with their debug+release SHA-1s.     ***"
    println "*** See docs/OAUTH-SECRETS.md.                                ***"
    println "****************************************************************"
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "ai.soulbits.chat"
    defaultConfig {
        applicationId "ai.soulbits.chat"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"

        resValue "string", "build_config_package", "ai.soulbits.chat"
    }
    flavorDimensions "environment"
    productFlavors {
        dev {
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            buildConfigField "boolean", "IS_BETA", "true"
            buildConfigField "String", "GOOGLE_WEB_CLIENT_ID", "\"${resolveOAuthValue('dev', 'GOOGLE_WEB_CLIENT_ID')}\""
            buildConfigField "String", "APPLE_SERVICES_ID", "\"${resolveOAuthValue('dev', 'APPLE_SERVICES_ID')}\""
            // E2E override — read from -P gradle properties (same pattern as
            // GOOGLE_WEB_CLIENT_ID above). Pass via:
            //   ./gradlew assembleDevDebug \
            //     -PHARMONY_LINK_WSS_URL=wss://10.0.2.2:28443 \
            //     -PHARMONY_LINK_WS_URL=ws://10.0.2.2:28080
            // Or set in ~/.gradle/gradle.properties for local dev.
            // When both are empty, ConnectionStateManager.applyE2EOverride() no-ops.
            buildConfigField "String", "HARMONY_LINK_WSS_URL", "\"${project.findProperty('HARMONY_LINK_WSS_URL') ?: ''}\""
            buildConfigField "String", "HARMONY_LINK_WS_URL", "\"${project.findProperty('HARMONY_LINK_WS_URL') ?: ''}\""
        }
        prod {
            buildConfigField "boolean", "IS_BETA", "false"
            buildConfigField "String", "GOOGLE_WEB_CLIENT_ID", "\"${resolveOAuthValue('prod', 'GOOGLE_WEB_CLIENT_ID')}\""
            buildConfigField "String", "APPLE_SERVICES_ID", "\"${resolveOAuthValue('prod', 'APPLE_SERVICES_ID')}\""
            // Production builds must NEVER carry the E2E override.
            buildConfigField "String", "HARMONY_LINK_WSS_URL", "\"\""
            buildConfigField "String", "HARMONY_LINK_WS_URL", "\"\""
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (project.hasProperty('RELEASE_KEYSTORE_FILE')) {
                storeFile file(RELEASE_KEYSTORE_FILE)
                storePassword RELEASE_KEYSTORE_PASSWORD
                keyAlias RELEASE_KEY_ALIAS
                keyPassword RELEASE_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            //
            // Two paths through this buildType:
            //  - Production/beta (prodRelease, devRelease without the flag): real
            //    release keystore + ProGuard minification, exactly as before.
            //  - E2E (devRelease with -PE2E_DEBUG_SIGNING=true): debug signing
            //    (no release keystore / secrets needed) + ProGuard disabled.
            //    "devRelease" is NOT in `debuggableVariants`, so the React Native
            //    Gradle Plugin bundles JS into the APK — which is required for the
            //    Docker E2E stack (no Metro dev server runs there). See
            //    e2e/build-apk.sh.
            if (project.hasProperty('E2E_DEBUG_SIGNING')) {
                signingConfig signingConfigs.debug
                minifyEnabled false
            } else {
                signingConfig signingConfigs.release
                minifyEnabled enableProguardInReleaseBuilds
            }
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// Copy react-native-vector-icons fonts to Android assets
apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")

// Google services plugin (required for Google Sign-In)
apply plugin: 'com.google.gms.google-services'
